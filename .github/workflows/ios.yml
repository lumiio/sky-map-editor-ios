name: ios-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compile Metal shaders (device)
        run: |
          set -euo pipefail
          mkdir -p ios/Resources/Shaders
          xcrun -sdk iphoneos metal -c ios/Shaders/Scene.metal -o /tmp/Scene.air
          xcrun -sdk iphoneos metallib /tmp/Scene.air -o ios/Resources/Shaders/default.metallib
          ls -lh ios/Resources/Shaders/default.metallib

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -project SkyMapEditor.xcodeproj -scheme SkyMapEditor \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build

      - name: Package unsigned ipa
        run: |
          set -euo pipefail
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/SkyMapEditor.app out/Payload/
          cd out && zip -qry SkyMapEditor-unsigned.ipa Payload
          ls -lh SkyMapEditor-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SkyMapEditor-unsigned-ipa
          path: out/SkyMapEditor-unsigned.ipa

  # 模拟器自测：不依赖真机，装进 iPhone 模拟器跑内置演示地形，截图判真。
  # 判据：画面不能等于清屏色，否则说明管线一帧都没画上去。
  sim-qa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compile Metal shaders (simulator)
        run: |
          set -euo pipefail
          mkdir -p ios/Resources/Shaders
          xcrun -sdk iphonesimulator metal -c ios/Shaders/Scene.metal -o /tmp/Scene-sim.air
          xcrun -sdk iphonesimulator metallib /tmp/Scene-sim.air -o ios/Resources/Shaders/default.metallib

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -project SkyMapEditor.xcodeproj -scheme SkyMapEditor \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build

      - name: Run demo on simulator
        run: |
          set -euo pipefail
          python3 -m venv /tmp/qa-venv
          /tmp/qa-venv/bin/pip install --quiet pillow
          UDID=$(xcrun simctl list devices available -j | python3 qa/pick_sim.py)
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build-sim/Build/Products/Release-iphonesimulator/SkyMapEditor.app

          # zip/apk 导入自测：造一个带 Data/Levels + Data/Meshes 的 deflate zip，
          # 让 App 用 --extract 无界面解压，再核对解出来的字节。
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("/tmp/test-import.zip", "w", zipfile.ZIP_DEFLATED) as z:
              z.writestr("Data/Levels/DemoLevel/Objects.level.bin", "TGCL" + "x" * 500)
              z.writestr("Data/Levels/DemoLevel/BstBaked.meshes", "LVL0" + "y" * 300)
              z.writestr("assets/Data/Meshes/Bin/Demo.mesh", "MESH" + "z" * 100)
          print("zip ok")
          PY
          xcrun simctl terminate "$UDID" com.skyeditor.ios || true
          xcrun simctl launch "$UDID" com.skyeditor.ios --extract /tmp/test-import.zip
          sleep 8
          BRIDGE=$(xcrun simctl get_app_container "$UDID" com.skyeditor.ios data)
          cat "$BRIDGE/Documents/boot.log" || true
          grep -q "解压测试通过" "$BRIDGE/Documents/boot.log"
          test -f "$BRIDGE/Documents/Data/Levels/DemoLevel/Objects.level.bin"
          test -f "$BRIDGE/Documents/Data/Meshes/Bin/Demo.mesh"
          echo "zip import OK"

          xcrun simctl terminate "$UDID" com.skyeditor.ios || true
          xcrun simctl launch "$UDID" com.skyeditor.ios --demo
          sleep 12
          xcrun simctl io "$UDID" screenshot /tmp/demo.png
          DATA=$(xcrun simctl get_app_container "$UDID" com.skyeditor.ios data)
          echo "--- boot.log ---"
          cat "$DATA/Documents/boot.log" || true
          /tmp/qa-venv/bin/python qa/check_demo.py /tmp/demo.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-screenshot
          path: /tmp/demo.png
